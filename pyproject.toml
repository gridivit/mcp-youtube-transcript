[project]
name = "mcp-youtube-transcript"
version = "0.1.0"
description = "MCP server that returns a YouTube video transcript by URL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "youtube-transcript-api>=1.2.4"
]

[project.scripts]
mcp-youtube-transcript = "mcp_youtube_transcript.server:main"

[build-system]
requires = ['hatchling']
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]