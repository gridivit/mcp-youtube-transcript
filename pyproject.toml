[project]
name = "mcp-youtube-transcript"
version = "0.1.0"
description = "MCP server that returns a YouTube video transcript by URL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "youtube-transcript-api>=1.2.4"
]

[project.scripts]
mcp-youtube-transcript = "mcp_youtube_transcript.server:main"

[build-system]
requires = ['hatchling']
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
preview = true

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "G",
    "PL",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["line-too-long"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]